# CI 配置：fork 友好版（去掉了官方版的 fork 阻止检查）
# 官方 NootedRed main.yml 有个 if 检查：github.repository != 'ChefKissInc/NootedRed' 时会 exit 1
# fork 仓库必须去掉它，否则 CI 直接失败
# 用法：放到你 fork 后的仓库根目录 .github/workflows/main.yml

name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"          # 拉 Lilu + MacKernelSDK 子模块

      - name: Build Debug (x86_64)
        run: xcodebuild -configuration Debug -arch x86_64 build

      - name: Build Release (x86_64)
        run: xcodebuild -configuration Release -arch x86_64 build

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/*/*.zip

      - name: Summary
        run: |
          echo "## ✅ NootedRed 编译成功" >> $GITHUB_STEP_SUMMARY
          echo "- 下载 artifact: **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "- kext 位于 zip 内的 NootedRed.kext" >> $GITHUB_STEP_SUMMARY
          echo "- 配合 Lilu.kext 放入 OpenCore EFI/OC/Kexts/" >> $GITHUB_STEP_SUMMARY
